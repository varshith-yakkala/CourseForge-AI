services:
  - type: web
    name: courseforge-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    disk:
      name: courseforge-data
      mountPath: /data
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: UPLOAD_DIR
        value: ./uploads
      - key: STORAGE_DIR
        value: ./backend/storage/data
